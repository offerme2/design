<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>OOH Map / List</title><link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/refinements.css"><link rel="stylesheet" href="assets/fx.css"><script src="assets/data.js" defer></script><script src="assets/i18n-data.js" defer></script><script src="assets/i18n.js" defer></script><script src="assets/media.js" defer></script><script src="assets/tw.js" defer></script><link rel="stylesheet" href="assets/inquiry.css"><script src="assets/inquiry.js" defer></script><script src="assets/app.js" defer></script><script src="assets/i18n-after.js" defer></script><script src="assets/fx.js" defer></script><style>body{--skin-background:url("themes/default/background.png")}</style></head>
<body><a class="skip" href="#catalog">跳到版位清單</a><header><a href="index.html" class="brand" aria-label="Offerme² 首頁"><img src="themes/default/logo.png" alt="Offerme²"></a><nav aria-label="主導覽"><button id="networkNav" class="navlink">Network</button><a href="#catalog">Locations <span class="navcount">254</span></a><button id="aboutNav" class="navlink">資料說明 ↗</button></nav><span class="offline"><i></i> OFFLINE ATLAS</span></header>
<main><section class="atlas" aria-label="台灣 OOH 資源地圖"><div class="map-heading"><p class="eyebrow">MAP / LIST</p><h1>OOH<br>Map<span>.</span></h1><div class="key-stats"><div><strong id="total"></strong><span>紀錄</span></div><div><strong id="cityTotal"></strong><span>城市 / 範圍</span></div></div></div>
<div class="map-wrap"><svg id="map" viewBox="0 0 1000 800" role="img" aria-label="台灣示意地圖；城市標記可點選，全部版位亦可由下方清單開啟"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" class="theme-grid-line" stroke-width=".65"/></pattern><pattern id="terrain" width="18" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><path d="M0 0L8 8L0 16M7 0L15 8L7 16" fill="none" class="theme-terrain-line" stroke-width=".65"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="1000" height="800" fill="url(#grid)"/><g id="land"></g><g id="routes"></g><g id="markers"></g></svg></div>
<div class="map-tools"><button id="reset" aria-label="回到台灣全島">全島 ↗</button><button id="zoomIn" aria-label="放大地圖">＋</button><button id="zoomOut" aria-label="縮小地圖">−</button></div><div class="map-legend"><span><i></i> 城市資源</span><span><i class="red"></i> 已選取</span><span>示意底圖 · 非導航用途</span></div><div class="map-caption"><span id="mapMode">TAIWAN / OVERVIEW</span><span>座標皆為推估或區域代表點</span></div></section>
<aside id="panel" class="panel" aria-label="版位資訊"></aside></main>
<section id="catalog" class="catalog"><div class="catalog-head"><div><p class="eyebrow">LIST / FILTER</p><h2>版位 <span id="resultCount" aria-live="polite"></span></h2></div><p id="recordNotice"></p></div><form id="filters" class="filters" role="search"><label>搜尋<input id="search" type="search" placeholder="版位 / 商圈" autocomplete="off"></label><label>城市 / 範圍<select id="city"><option value="">全部</option></select></label><label>行政區 / 商圈<select id="district"><option value="">全部</option></select></label><label>媒體類別<select id="type"><option value="">全部</option></select></label><label>媒體型式<select id="format"><option value="">全部</option></select></label><button type="reset">清除</button></form><div id="results" class="results"></div><button id="more" class="more">顯示更多 ↓</button><p id="empty" hidden>無符合結果</p></section>
<footer><strong>Offerme²</strong><p id="footerNotice"></p><button id="sourceNav">來源 / 定位說明 ↗</button></footer>
<dialog id="about"><button class="dialog-close" aria-label="關閉">×</button><p class="eyebrow">DATA</p><h2>來源 / 定位說明</h2><div id="aboutData"></div><button class="primary dialog-close">返回</button></dialog>
</body></html>
